---
name: Build
on:
  push:
    branches:
      - master
      - branch-*
      - dogfood-*
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: github-ubuntu-latest-s
    name: Build
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: SonarSource/mise-action-wrapper@65aa289d3f408f4999d13a52a14cde4f54b48442 # 2.0.0
        with:
          version: 2025.7.12
      - uses: SonarSource/ci-github-actions/build-maven@v1
        with:
          deploy-pull-request: true
          artifactory-reader-role: private-reader
          artifactory-deployer-role: qa-deployer

  black_box_test:
    needs: [build]
    runs-on: github-ubuntu-latest-s
    name: Black Box Tests (${{ matrix.sonar_version }})
    if: |
      github.event_name != 'push' ||
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/heads/branch-') ||
      startsWith(github.ref, 'refs/heads/dogfood-')
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        sonar_version:
          - "LATEST_RELEASE[26.1]"
    steps:
      # Masked secrets can't be passed between jobs or used in `services.credentials`,
      # so authenticate and start postgres in a step instead.
      - name: Get Docker Hub credentials
        id: docker_secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/kv/data/docker/sonardocker login | dockerhub_username;
            development/kv/data/docker/sonardocker access_token_ro | dockerhub_token;
      - name: Start postgres
        env:
          DOCKERHUB_USERNAME: ${{ fromJSON(steps.docker_secrets.outputs.vault).dockerhub_username }}
          DOCKERHUB_TOKEN: ${{ fromJSON(steps.docker_secrets.outputs.vault).dockerhub_token }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5 \
            postgres:15
          timeout 120 sh -c 'until [ "$(docker inspect -f {{.State.Health.Status}} postgres)" = healthy ]; do sleep 2; done'
          docker logout
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: SonarSource/mise-action-wrapper@65aa289d3f408f4999d13a52a14cde4f54b48442 # 2.0.0
        with:
          version: 2025.7.12
      - name: Get build number
        id: build_number
        uses: SonarSource/ci-github-actions/get-build-number@v1
      - name: Get Artifactory credentials
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/kv/data/repox url | ARTIFACTORY_URL;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader username | ARTIFACTORY_USERNAME;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_PASSWORD;
      - name: Run black box tests
        env:
          ARTIFACTORY_URL: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_URL }}
          ARTIFACTORY_PRIVATE_USERNAME: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USERNAME }}
          ARTIFACTORY_PRIVATE_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_PASSWORD }}
          ARTIFACTORY_ACCESS_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_PASSWORD }}
        run: |
          mvn verify -Pblack-box-tests \
            -Dsonar.runtimeVersion=${{ matrix.sonar_version }} \
            -Dorchestrator.configUrl=file:///${{ github.workspace }}/conf/orchestrator.properties \
            -Dwebdriver.chrome.driver=/usr/bin/chromedriver
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports-${{ matrix.sonar_version }}
          path: |
            **/target/**/logs/*
            **/target/failsafe-reports/**/*

  promote:
    needs: [build, black_box_test]
    runs-on: github-ubuntu-latest-s
    name: Promote
    if: |
      github.event_name != 'push' ||
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/heads/branch-') ||
      startsWith(github.ref, 'refs/heads/dogfood-')
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: step-security/mise-action@a225bbd7c202ddf57dd76dff22bb7992f6314173 # v5.1.2
        with:
          persist_github_token: true
          cache_save: false
          version: 2025.7.12
      - uses: SonarSource/ci-github-actions/promote@v1
        with:
          promote-pull-request: true
